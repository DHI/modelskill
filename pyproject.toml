[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["**/.mypy_cache**", "**/.mypy_cache/**"]
wheel-exclude = ["**/.mypy_cache**", "**/.mypy_cache/**"]

[project]
name = "modelskill"
version = "1.4.0a3"
dependencies = [
    "numpy  > 1.24.4",
    "pandas >= 1.4, < 3.0", # TODO remove upper limit
    "mikeio >= 1.2",
    "matplotlib",
    "xarray",
    "netCDF4",
    "scipy",
    "jinja2",               # used for skill.style
    "typing-extensions",
    "pyyaml",
]

authors = [
    { name = "Jesper Sandvig Mariegaard", email = "jem@dhigroup.com" },
    { name = "Henrik Andersson", email = "jan@dhigroup.com" },
]
description = "Compare results from simulations with observations."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# networkx and xarray arrive through mikeio1d's own network extra, which
# carries the topology layer this package builds on (ADR-013).
network = ["mikeio1d[network]"]

[dependency-groups]
dev = ["pytest", "plotly >= 4.5", "ruff==0.6.2", "netCDF4", "dask"]

docs = ["quartodoc==0.11.1", "nbformat", "nbconvert", "ipykernel", "griffe<2"]

test = [
    "pytest",
    "pytest-cov",
    "openpyxl",
    "dask",
    "mypy==1.19.1",
    "types-PyYAML",
    "geopandas",
]

notebooks = ["nbformat", "nbconvert", "jupyter", "plotly", "shapely", "seaborn"]

network = ["mikeio1d[network]"]

[tool.uv.sources]
# TODO: swap for a version floor in both "network" entries above once mikeio1d
# releases the network module. ADR-013 holds modelskill 1.4.0 until it does.
mikeio1d = { git = "https://github.com/DHI/mikeio1d", branch = "main" }

[project.urls]
"Homepage" = "https://github.com/DHI/modelskill"
"Bug Tracker" = "https://github.com/DHI/modelskill/issues"


[tool.ruff]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E4", "E7", "E9", "F", "D200", "D205"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unreachable = false
no_implicit_optional = true


[[tool.mypy.overrides]]
module = "modelskill.metrics"
ignore_errors = true
