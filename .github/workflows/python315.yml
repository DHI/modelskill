name: Python 3.15 compatibility
# Temporary: checks Python 3.15 support and the removed pandas < 3.0 cap.
# Replace with 3.15 entries in the permanent workflows once green.

on:
  push:
    branches: [python-3.15]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install-as-user:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"

      - name: Build wheel
        run: uv build

      - name: Install wheel with pip in a fresh venv
        run: |
          uv venv --seed fresh
          if [ "$RUNNER_OS" = "Windows" ]; then PY=fresh/Scripts/python; else PY=fresh/bin/python; fi
          $PY -m pip install --only-binary pandas,numpy,scipy,matplotlib,netCDF4 dist/*.whl
          $PY -m pip list
          $PY -c "import sys, modelskill, pandas, numpy, mikeio; print(sys.version, modelskill.__version__, pandas.__version__, numpy.__version__, mikeio.__version__)"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14", "3.15"]
        deps: [core, network]

    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "network" ]; then
            uv sync --group test --group network --no-dev
          else
            uv sync --group test --no-dev
          fi

      - name: Show installed versions
        run: uv pip list

      - name: Test
        run: uv run pytest -rw

      - name: Doctest
        run: just doctest

  notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group test --group notebooks --group network --no-dev

      - name: Test notebooks
        run: uv run pytest tests/notebooks/
